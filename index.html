<script>
/* ═══════════════════════════════════════════════════════════════════
   قسم 1: تطبيع النصوص (مطابق لـ text_parser.py)
   ═══════════════════════════════════════════════════════════════════ */

const ARABIC_DIGITS_MAP = {
  '٠':'0','١':'1','٢':'2','٣':'3','٤':'4',
  '٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
  '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4',
  '۵':'5','۶':'6','۷':'7','۸':'8','۹':'9',
};

function translateDigits(s) {
  return s.replace(/[٠-٩۰-۹]/g, ch => ARABIC_DIGITS_MAP[ch] || ch);
}

const INVISIBLE_RE = /[\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]/g;

function removeInvisible(s) {
  return s.replace(INVISIBLE_RE, '');
}

function normalizeForCompare(text) {
  if (!text) return '';
  let s = translateDigits(text);
  s = removeInvisible(s);
  // NFKC normalization (متاح في JavaScript)
  s = s.normalize('NFKC');
  s = s.replace(/\s+/g, ' ').trim().toLowerCase();
  return s;
}

function normalizeForDisplay(text) {
  if (!text) return '';
  let s = removeInvisible(text);
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

/* استخراج هوية الفئة من اسمها */
const RE_LATIN_PAREN = /\(([^)]*[A-Za-z][^)]*)\)/;
const RE_FATHA_NAME  = /فئة\s+([^\(:،,]+)/;

function categoryIdentity(name) {
  if (!name) return '';
  const norm = normalizeForCompare(name);

  // 1) إنجليزي بين قوسين
  const m1 = norm.match(RE_LATIN_PAREN);
  if (m1) {
    const latin = m1[1].replace(/[^a-z0-9 ]+/g, '').trim();
    if (latin) return latin;
  }

  // 2) "فئة <اسم>"
  let cleaned = norm.replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim();
  const m2 = cleaned.match(RE_FATHA_NAME);
  if (m2) return 'فئة ' + m2[1].trim();

  // 3) السقوط الآمن
  return cleaned;
}

/* ═══════════════════════════════════════════════════════════════════
   قسم 2: كشف رأس الفئة (مطابق للـ Python)
   ═══════════════════════════════════════════════════════════════════ */

const BULLETS = '•▪▫◦●○■□★';
const BULLETS_ESC = '\\u2022\\u25aa\\u25ab\\u25e6\\u25cf\\u25cb\\u25a0\\u25a1\\u2605';

const RE_CATEGORY = new RegExp(
  '^\\s*' +
  '(?:[' + BULLETS_ESC + ']\\s*)?' +
  '(?:' +
    '(?:أولاً|ثانياً|ثالثاً|رابعاً|خامساً|سادساً|سابعاً|ثامناً|تاسعاً|عاشراً)' +
    '|(?:\\d{1,2}[\\.\\):\\-])' +
    '|(?:[a-zA-Zا-ي])\\s*[\\.\\):\\-]' +
  ')?' +
  '\\s*[:：\\.\\-–—]?\\s*' +
  '(.+?)' +
  '\\s*[:：]\\s*$'
);

// ملاحظة: \b في JS regex لا يعمل مع العربية (يطابق فقط [a-zA-Z0-9_]).
// نستخدم بدائل تستخدم بداية/نهاية السطر أو محارف غير-كلمة.
const RE_HAS_FATHA = /(?:^|[^\u0600-\u06ff])فئة(?:[^\u0600-\u06ff]|$)|(?:^|[^\u0600-\u06ff])الفئة(?:[^\u0600-\u06ff]|$)|\bCategory\b|\bSection\b/i;
const RE_STARTS_BULLET = new RegExp('^\\s*[' + BULLETS_ESC + ']');
const RE_LOOKS_QTY = /^\s*\d+\s*[-–—]/;
// يلتقط "فئة <اسم>" حتى لو لم يكن في بداية السطر (لكن غالباً يكون هو السطر كله)
const RE_FATHA_FREE = /(?:^|[\s\-–—:])فئة\s+([^\d:،,\(]+?)(?:\s*[\(:،,]|\s*$)/;
// كاشف وجود رقم كمية في السطر (لاستثناء أسطر "5 - iPhone")
const RE_HAS_QTY = /\d/;

function isCategoryHeader(line) {
  const s = normalizeForDisplay(line);
  if (!s) return [false, ''];

  // ─── المسار 1: النمط الأصلي (ينتهي بنقطتين) ───
  const m = s.match(RE_CATEGORY);
  if (m) {
    let title = m[1].trim();
    const bulletStripRe = new RegExp('^[' + BULLETS_ESC + '\\s\\-–—]+');
    title = title.replace(bulletStripRe, '').trim();
    if (title) {
      // 1.أ) يحوي كلمة "فئة"
      if (RE_HAS_FATHA.test(s)) return [true, title];
      // 1.ب) يبدأ بـbullet ولا يحوي رقم كمية
      const startsBullet = RE_STARTS_BULLET.test(line);
      const looksQty = RE_LOOKS_QTY.test(title);
      if (startsBullet && !looksQty) return [true, title];
    }
  }

  // ─── المسار 2: ذكاء جديد - "فئة <اسم>" بدون نقطتين أو bullet ───
  // ينطبق فقط إذا:
  //   - يحوي كلمة "فئة"
  //   - لا يحوي أرقام كمية في الجزء الأول من السطر
  //   - السطر قصير نسبياً (رؤوس الفئات عادةً قصيرة)
  if (RE_HAS_FATHA.test(s)) {
    // استخرج كل ما بعد "فئة" حتى أول علامة فاصلة أو نهاية السطر
    const m2 = s.match(RE_FATHA_FREE);
    if (m2) {
      let title = m2[1].trim();
      // نظّف الـ bullets والشرطات من النهايتين
      const cleanRe = new RegExp('^[' + BULLETS_ESC + '\\s\\-–—:]+|[' + BULLETS_ESC + '\\s\\-–—:]+$', 'g');
      title = title.replace(cleanRe, '').trim();

      // شروط القبول:
      //   - الاسم الناتج بطول معقول (2-50 حرفاً)
      //   - السطر بطول معقول (لا يتجاوز 80 حرفاً، رؤوس الفئات قصيرة)
      //   - السطر ليس فيه كمية + اسم جهاز (نتأكد بعدم وجود فاصل أرقام)
      //   - الاسم نفسه ليس مجرد أرقام
      if (title.length >= 2 && title.length <= 50 && s.length <= 80 && !/^\d+$/.test(title)) {
        // تأكد أن السطر ليس صف جهاز
        const titleHasDigit = /\d/.test(title);
        const lineHasDigit = /\d/.test(s);
        // اشتراطات إضافية للرفض:
        //   1) إذا الاسم يحوي أرقاماً، فالأرجح هذا اسم جهاز - ارفض
        //   2) إذا السطر يبدأ برقم متبوعاً بمسافة (ربما كمية)، ارفض
        //   3) إذا السطر فيه نمط كمية صريح (رقم - شيء)، ارفض
        const startsWithQty = /^\s*\d+\s*([-–—:|]|\s)/.test(s);
        const hasQtyPattern = /\d+\s*[-–—:|]/.test(s) || /[-–—:|]\s*\d+\s*$/.test(s);
        if (titleHasDigit || startsWithQty || hasQtyPattern) {
          // مشبوه - قد يكون صف جهاز - ارفض
        } else {
          // هذا رأس فئة "فئة <شيء>"
          return [true, 'فئة ' + title];
        }
      }
    }
  }

  // ─── المسار 3: bullet + سطر قصير لا يحوي أرقاماً (رأس بدون نقطتين) ───
  // مثل: "• حمايات الكاميرا" بدون كولن في النهاية
  const startsBullet = RE_STARTS_BULLET.test(line);
  if (startsBullet && s.length <= 60) {
    // أزل الـ bullet
    const bulletStripRe = new RegExp('^[' + BULLETS_ESC + '\\s\\-–—:]+');
    let title = s.replace(bulletStripRe, '').trim();
    // أزل النقطتين/الفاصلة من النهاية إن وُجدت
    title = title.replace(/[:：،,]+$/, '').trim();
    // اقبل فقط إذا لا يحوي أرقاماً (وإلا فهو غالباً جهاز بـbullet)
    if (title.length >= 2 && !RE_HAS_QTY.test(title)) {
      return [true, title];
    }
  }

  return [false, ''];
}

/* ═══════════════════════════════════════════════════════════════════
   قسم 3: استخراج (الكمية + الاسم) من سطر واحد
   ═══════════════════════════════════════════════════════════════════ */

const RE_QTY_LEFT_SEP  = /^\s*(\d+)\s*[-–—:|]\s*(.+?)\s*$/;
const RE_QTY_RIGHT_SEP = /^\s*(.+?)\s*[-–—:|]\s*(\d+)\s*$/;
const RE_QTY_LEFT_SP   = /^\s*(\d+)\s+([^\d\s].*?)\s*$/;
const RE_QTY_RIGHT_SP  = /^\s*(\D.+?)\s+(\d+)\s*$/;

const STRIP_CHARS = '-–—:|*•▪▫◦●○■□★ ';

function extractQtyName(line) {
  let s = removeInvisible(line);
  s = translateDigits(s);
  s = s.replace(/\s+/g, ' ').trim();
  if (!s) return null;

  const tries = [
    { re: RE_QTY_LEFT_SEP,  qIdx: 1, nIdx: 2 },
    { re: RE_QTY_RIGHT_SEP, qIdx: 2, nIdx: 1 },
    { re: RE_QTY_LEFT_SP,   qIdx: 1, nIdx: 2 },
    { re: RE_QTY_RIGHT_SP,  qIdx: 2, nIdx: 1 },
  ];

  for (const t of tries) {
    const m = s.match(t.re);
    if (!m) continue;
    const qty = parseInt(m[t.qIdx], 10);
    if (isNaN(qty)) continue;
    let name = m[t.nIdx].trim();
    // إزالة الفواصل من الأطراف
    let changed = true;
    while (changed) {
      changed = false;
      for (const ch of STRIP_CHARS) {
        if (name.startsWith(ch)) { name = name.slice(1); changed = true; }
        if (name.endsWith(ch))   { name = name.slice(0, -1); changed = true; }
      }
      name = name.trim();
    }
    if (name.length < 2) continue;
    if (/^\d+$/.test(name)) continue;
    return [qty, name];
  }

  return null;
}

/* ═══════════════════════════════════════════════════════════════════
   قسم 4: المحلّل الرئيسي (TextParser)
   ═══════════════════════════════════════════════════════════════════ */

const DEFAULT_SECTION_NAME = 'بدون فئة';

function parseText(text) {
  const doc = {
    intro_lines: [],
    sections: [],
    skipped_lines: [],
    get total_items() {
      return this.sections.reduce((a, s) => a + s.items.length, 0);
    }
  };

  if (!text || !text.trim()) return doc;

  let current = null;
  let beforeFirst = true;

  const lines = text.split(/\r?\n/);
  for (const rawLine of lines) {
    const line = rawLine.replace(/\s+$/, '');
    if (!line.trim()) continue;

    // 1) محاولة كشف رأس فئة
    const [isHdr, hdrTitle] = isCategoryHeader(line);
    if (isHdr) {
      current = {
        name: hdrTitle,
        header_raw: line.trim(),
        items: [],
        key: categoryIdentity(hdrTitle),
      };
      doc.sections.push(current);
      beforeFirst = false;
      continue;
    }

    // 2) محاولة استخراج (كمية + جهاز)
    const extracted = extractQtyName(line);
    if (extracted === null) {
      if (beforeFirst) doc.intro_lines.push(line.trim());
      else doc.skipped_lines.push(line.trim());
      continue;
    }

    const [qty, name] = extracted;
    const displayName = normalizeForDisplay(name);

    if (current === null) {
      current = {
        name: DEFAULT_SECTION_NAME,
        header_raw: '',
        items: [],
        key: categoryIdentity(DEFAULT_SECTION_NAME),
      };
      doc.sections.push(current);
      beforeFirst = false;
    }

    current.items.push({
      name: displayName,
      qty: qty,
      raw_line: line.trim(),
      key: normalizeForCompare(displayName),
    });
  }

  return doc;
}

/* ═══════════════════════════════════════════════════════════════════
   قسم 5: محرّك الموازنة (BalanceEngine)
   ═══════════════════════════════════════════════════════════════════ */

function balanceItem(item) {
  const total = item.qty_a + item.qty_b;
  item.total = total;

  if (total === 0) {
    item.balanced_a = 0;
    item.balanced_b = 0;
    item.transfer_qty = 0;
    item.transfer_direction = 'متوازن';
    item.is_balanced = true;
    return;
  }

  if (total % 2 === 0) {
    item.balanced_a = total / 2;
    item.balanced_b = total / 2;
  } else {
    item.balanced_a = Math.ceil(total / 2);  // النصف + 1
    item.balanced_b = Math.floor(total / 2);
  }

  const diffA = item.balanced_a - item.qty_a;
  if (diffA === 0) {
    item.transfer_qty = 0;
    item.transfer_direction = 'متوازن';
    item.is_balanced = true;
  } else if (diffA > 0) {
    item.transfer_qty = diffA;
    item.transfer_direction = 'B←A';
    item.is_balanced = false;
  } else {
    item.transfer_qty = Math.abs(diffA);
    item.transfer_direction = 'A←B';
    item.is_balanced = false;
  }
}

function runBalanceEngine(branchA, branchB, docA, docB, sessionName) {
  const result = {
    branch_a: branchA || 'الفرع الأول',
    branch_b: branchB || 'الفرع الثاني',
    session_name: sessionName,
    intro_a: [...docA.intro_lines],
    intro_b: [...docB.intro_lines],
    skipped_a: [...docA.skipped_lines],
    skipped_b: [...docB.skipped_lines],
    categories: [],
  };

  // 1) فهرسة الفئات
  const sectionsA = {};
  const sectionsB = {};
  const order = [];

  for (const sec of docA.sections) {
    sectionsA[sec.key] = sec;
    if (!order.includes(sec.key)) order.push(sec.key);
  }
  for (const sec of docB.sections) {
    sectionsB[sec.key] = sec;
    if (!order.includes(sec.key)) order.push(sec.key);
  }

  // 2) بناء كل فئة
  for (const key of order) {
    const sa = sectionsA[key];
    const sb = sectionsB[key];
    const displayName = (sa ? sa.name : sb.name);

    const cat = {
      name: displayName,
      items: [],
      only_in: '',
    };
    if (sa && !sb) cat.only_in = 'A';
    else if (sb && !sa) cat.only_in = 'B';

    // اجمع كل الأجهزة
    const qtyMap = {};
    const orderInCat = [];

    function accumulate(items, side) {
      for (const it of items) {
        if (!(it.key in qtyMap)) {
          qtyMap[it.key] = { name: it.name, qty_a: 0, qty_b: 0 };
          orderInCat.push(it.key);
        }
        if (side === 'A') qtyMap[it.key].qty_a += it.qty;
        else qtyMap[it.key].qty_b += it.qty;
      }
    }

    if (sa) accumulate(sa.items, 'A');
    if (sb) accumulate(sb.items, 'B');

    for (const k of orderInCat) {
      const e = qtyMap[k];
      let onlyIn = '';
      if (e.qty_a > 0 && e.qty_b === 0) onlyIn = 'A';
      else if (e.qty_b > 0 && e.qty_a === 0) onlyIn = 'B';

      const bi = {
        device_name: e.name,
        qty_a: e.qty_a,
        qty_b: e.qty_b,
        only_in: onlyIn,
        balanced_a: 0,
        balanced_b: 0,
        transfer_qty: 0,
        transfer_direction: '',
        is_balanced: false,
      };
      balanceItem(bi);
      cat.items.push(bi);
    }

    // المجاميع
    cat.total_a = cat.items.reduce((a, i) => a + i.qty_a, 0);
    cat.total_b = cat.items.reduce((a, i) => a + i.qty_b, 0);
    cat.total_a_to_b = cat.items
      .filter(i => i.transfer_direction === 'A←B')
      .reduce((a, i) => a + i.transfer_qty, 0);
    cat.total_b_to_a = cat.items
      .filter(i => i.transfer_direction === 'B←A')
      .reduce((a, i) => a + i.transfer_qty, 0);

    result.categories.push(cat);
  }

  // إجماليات
  result.total_transferred_a_to_b = result.categories.reduce((a, c) => a + c.total_a_to_b, 0);
  result.total_transferred_b_to_a = result.categories.reduce((a, c) => a + c.total_b_to_a, 0);
  result.total_items = result.categories.reduce((a, c) => a + c.items.length, 0);

  // ─── قائمة الأجهزة الناقصة (qty < 9) في أيّ من الفرعين ───
  // نجمع كل صف فيه qty_a<9 أو qty_b<9 (الكميات الأصلية قبل الموازنة)
  result.low_stock = [];
  const LOW_THRESHOLD = 9;
  for (const cat of result.categories) {
    for (const it of cat.items) {
      const lowA = it.qty_a < LOW_THRESHOLD;
      const lowB = it.qty_b < LOW_THRESHOLD;
      if (!lowA && !lowB) continue;
      // حدّد أيّ فرع/فروع ناقص
      let lowIn;
      if (lowA && lowB) lowIn = 'BOTH';
      else if (lowA) lowIn = 'A';
      else lowIn = 'B';
      result.low_stock.push({
        category_name: cat.name,
        device_name: it.device_name,
        qty_a: it.qty_a,
        qty_b: it.qty_b,
        only_in: it.only_in,
        low_in: lowIn,
      });
    }
  }
  result.low_threshold = LOW_THRESHOLD;

  return result;
}

/* ═══════════════════════════════════════════════════════════════════
   قسم 6: توليد المذكّرة النصية
   ═══════════════════════════════════════════════════════════════════ */

function generateMemo(result) {
  const bA = result.branch_a;
  const bB = result.branch_b;
  const lines = [];

  lines.push('═'.repeat(50));
  lines.push(`   مذكّرة نقل  -  ${bA}  ↔  ${bB}`);
  lines.push('═'.repeat(50));
  lines.push(`الجلسة : ${result.session_name || '—'}`);
  lines.push('─'.repeat(50));

  for (const cat of result.categories) {
    if (cat.only_in === 'A') {
      lines.push(`\n■ ${cat.name}  ⚠ موجودة في ${bA} فقط`);
    } else if (cat.only_in === 'B') {
      lines.push(`\n■ ${cat.name}  ⚠ موجودة في ${bB} فقط`);
    } else {
      lines.push(`\n■ ${cat.name}`);
    }

    const aToB = cat.items.filter(i => i.transfer_direction === 'A←B' && i.transfer_qty > 0);
    const bToA = cat.items.filter(i => i.transfer_direction === 'B←A' && i.transfer_qty > 0);

    if (aToB.length) {
      lines.push(`   ▶ من ${bA} إلى ${bB}:`);
      for (const it of aToB) {
        const suffix = it.only_in === 'A' ? `   ⚠ موجود في ${bA} فقط` : '';
        lines.push(`      • ${it.device_name}  ← ${it.transfer_qty} قطعة${suffix}`);
      }
    }
    if (bToA.length) {
      lines.push(`   ▶ من ${bB} إلى ${bA}:`);
      for (const it of bToA) {
        const suffix = it.only_in === 'B' ? `   ⚠ موجود في ${bB} فقط` : '';
        lines.push(`      • ${it.device_name}  ← ${it.transfer_qty} قطعة${suffix}`);
      }
    }
    if (!aToB.length && !bToA.length) {
      lines.push('   ✔ متوازنة بالكامل');
    }
  }

  lines.push('\n' + '─'.repeat(50));
  lines.push(`إجمالي النقل ${bA} ← ${bB} : ${result.total_transferred_a_to_b} قطعة`);
  lines.push(`إجمالي النقل ${bB} ← ${bA} : ${result.total_transferred_b_to_a} قطعة`);
  lines.push('═'.repeat(50));

  // قسم الأجهزة الناقصة
  if (result.low_stock && result.low_stock.length > 0) {
    const threshold = result.low_threshold;
    lines.push('');
    lines.push('═'.repeat(50));
    lines.push(`   ⚠ أجهزة كميتها < ${threshold} في أحد الفرعين`);
    lines.push('═'.repeat(50));

    // جمّع حسب الفئة
    const byCategory = {};
    for (const ls of result.low_stock) {
      if (!(ls.category_name in byCategory)) byCategory[ls.category_name] = [];
      byCategory[ls.category_name].push(ls);
    }

    for (const catName in byCategory) {
      lines.push(`\n■ ${catName}`);
      for (const ls of byCategory[catName]) {
        const aPart = `${bA}: ${ls.qty_a}${ls.qty_a < threshold ? ' ⚠' : ''}`;
        const bPart = `${bB}: ${ls.qty_b}${ls.qty_b < threshold ? ' ⚠' : ''}`;
        lines.push(`   • ${ls.device_name}   (${aPart} | ${bPart})`);
      }
    }
    lines.push('═'.repeat(50));
  }

  return lines.join('\n');
}

  $('label-a').textContent = `📋 رسالة الفرع: ${a}`;
  $('label-b').textContent = `📋 رسالة الفرع: ${b}`;
}

$('branch-a').addEventListener('input', updateBranchLabels);
$('branch-b').addEventListener('input', updateBranchLabels);

function loadSample() {
  $('text-a').value = SAMPLE_A;
  $('text-b').value = SAMPLE_B;
  if (!$('session-name').value.trim()) {
    const today = new Date().toISOString().slice(0, 10);
    $('session-name').value = `موازنة تجريبية ${today}`;
  }
  showToast('تم إدراج النموذج', 'success');
}

function clearAll() {
  $('text-a').value = '';
  $('text-b').value = '';
  $('session-name').value = '';
  $('results-container').innerHTML = '';
  $('low-stock-container').innerHTML = '';
  $('results-section').classList.remove('visible');
  $('export-bar').classList.remove('visible');
  lastResult = null;
  showToast('تم مسح الكل');
}

function runBalance() {
  const textA = $('text-a').value.trim();
  const textB = $('text-b').value.trim();

  if (!textA || !textB) {
    showToast('الرجاء لصق رسالة الفرعين قبل التحليل', 'error');
    return;
  }

  const branchA = $('branch-a').value.trim() || 'الرانوناء';
  const branchB = $('branch-b').value.trim() || 'الحمراء';
  const today = new Date().toISOString().slice(0, 10);
  const session = $('session-name').value.trim() || `موازنة ${today}`;

  let docA, docB;
  try {
    docA = parseText(textA);
    docB = parseText(textB);
  } catch (e) {
    showToast(`فشل التحليل: ${e.message}`, 'error');
    return;
  }

  if (docA.total_items === 0 && docB.total_items === 0) {
    showToast('لم يُتعرّف على أي جهاز في النصوص', 'warn');
    return;
  }

  lastResult = runBalanceEngine(branchA, branchB, docA, docB, session);
  renderResults(lastResult);

  // مرّر إلى النتائج
  setTimeout(() => {
    $('results-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

/* ═══════════════════════════════════════════════════════════════════
   قسم 9: رسم النتائج
   ═══════════════════════════════════════════════════════════════════ */

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderResults(result) {
  $('results-section').classList.add('visible');
  $('export-bar').classList.add('visible');

  const bA = result.branch_a;
  const bB = result.branch_b;

  // الملخّص
  $('summary-title').textContent =
    `📊 ${result.session_name}  •  ${result.categories.length} فئة  •  ${result.total_items} جهاز`;
  const skipCount = result.skipped_a.length + result.skipped_b.length;
  const skipPart = skipCount ? `  •  تجاهلت ${skipCount} سطراً غير مفهوم` : '';
  $('summary-detail').textContent =
    `إجمالي النقل  ▶  ${bA} ← ${bB}: ${result.total_transferred_a_to_b} قطعة   |   ${bB} ← ${bA}: ${result.total_transferred_b_to_a} قطعة${skipPart}`;

  // الفئات
  const c = $('results-container');
  c.innerHTML = '';
  for (const cat of result.categories) {
    c.appendChild(buildCategoryBlock(cat, bA, bB));
  }

  // قسم الأجهزة الناقصة (<9)
  renderLowStock(result);
}

function renderLowStock(result) {
  const container = $('low-stock-container');
  container.innerHTML = '';
  if (!result.low_stock || result.low_stock.length === 0) return;

  const bA = result.branch_a;
  const bB = result.branch_b;
  const threshold = result.low_threshold;

  const section = document.createElement('div');
  section.className = 'low-stock-section';

  // رأس
  const header = document.createElement('div');
  header.className = 'low-stock-header';
  header.innerHTML = `
    <span>⚠ أجهزة كميتها أقل من ${threshold} في أحد الفرعين</span>
    <span class="badge">${result.low_stock.length}</span>
  `;
  section.appendChild(header);

  // قائمة
  const list = document.createElement('div');
  list.className = 'low-stock-list';

  for (const ls of result.low_stock) {
    const item = document.createElement('div');
    item.className = 'low-stock-item';

    // حدّد كلاسات الكميات
    const aIsLow = ls.qty_a < threshold;
    const bIsLow = ls.qty_b < threshold;
    const aIsZero = ls.qty_a === 0;
    const bIsZero = ls.qty_b === 0;

    let aCls = 'ls-stat';
    if (aIsZero) aCls += ' is-low is-zero';
    else if (aIsLow) aCls += ' is-low';

    let bCls = 'ls-stat';
    if (bIsZero) bCls += ' is-low is-zero';
    else if (bIsLow) bCls += ' is-low';

    item.innerHTML = `
      <div class="ls-cat">📁 ${escapeHTML(ls.category_name)}</div>
      <div class="ls-name">${escapeHTML(ls.device_name)}</div>
      <div class="ls-stats">
        <div class="${aCls}"><span class="lbl">${escapeHTML(bA)}:</span><span class="val">${ls.qty_a}</span>${aIsLow ? ' ⚠' : ''}</div>
        <div class="${bCls}"><span class="lbl">${escapeHTML(bB)}:</span><span class="val">${ls.qty_b}</span>${bIsLow ? ' ⚠' : ''}</div>
      </div>
    `;
    list.appendChild(item);
  }

  section.appendChild(list);
  container.appendChild(section);
}

function buildCategoryBlock(cat, bA, bB) {
  const wrap = document.createElement('div');
  wrap.className = 'cat-block';

  // رأس الفئة
  const head = document.createElement('div');
  if (cat.only_in === 'A') {
    head.className = 'cat-header warn';
    head.textContent = `■ ${cat.name}    ⚠ موجودة في ${bA} فقط`;
  } else if (cat.only_in === 'B') {
    head.className = 'cat-header warn';
    head.textContent = `■ ${cat.name}    ⚠ موجودة في ${bB} فقط`;
  } else {
    head.className = 'cat-header';
    head.textContent = `■ ${cat.name}`;
  }
  wrap.appendChild(head);

  // === جدول لسطح المكتب ===
  const tableWrap = document.createElement('div');
  tableWrap.className = 'cat-table-wrap';
  let html = `<table class="cat-table">
    <thead><tr>
      <th>#</th>
      <th>الجهاز</th>
      <th>${escapeHTML(bA)}<br>(قبل)</th>
      <th>${escapeHTML(bB)}<br>(قبل)</th>
      <th>المجموع</th>
      <th>${escapeHTML(bA)}<br>(بعد)</th>
      <th>${escapeHTML(bB)}<br>(بعد)</th>
      <th>اتجاه النقل</th>
    </tr></thead><tbody>`;

  cat.items.forEach((item, idx) => {
    let nameTxt = escapeHTML(item.device_name);
    let nameClass = 'name';
    if (item.only_in === 'A') {
      nameTxt += `   ⚠ في ${escapeHTML(bA)} فقط`;
      nameClass += ' orange';
    } else if (item.only_in === 'B') {
      nameTxt += `   ⚠ في ${escapeHTML(bB)} فقط`;
      nameClass += ' orange';
    }

    let dirCls, dirTxt;
    if (item.transfer_direction === 'متوازن') {
      dirCls = 'green'; dirTxt = '✓ متوازن';
    } else if (item.transfer_direction === 'A←B') {
      dirCls = 'orange';
      dirTxt = `${escapeHTML(bA)} ← ${escapeHTML(bB)}  (${item.transfer_qty})`;
    } else {
      dirCls = 'red';
      dirTxt = `${escapeHTML(bB)} ← ${escapeHTML(bA)}  (${item.transfer_qty})`;
    }

    html += `<tr>
      <td>${idx + 1}</td>
      <td class="${nameClass}">${nameTxt}</td>
      <td>${item.qty_a}</td>
      <td>${item.qty_b}</td>
      <td class="bold">${item.total}</td>
      <td class="green">${item.balanced_a}</td>
      <td class="green">${item.balanced_b}</td>
      <td class="${dirCls}">${dirTxt}</td>
    </tr>`;
  });

  // صف الإجمالي
  const balATotal = cat.items.reduce((a, i) => a + i.balanced_a, 0);
  const balBTotal = cat.items.reduce((a, i) => a + i.balanced_b, 0);
  html += `<tr class="total">
    <td>Σ</td>
    <td class="name">إجمالي الفئة</td>
    <td>${cat.total_a}</td>
    <td>${cat.total_b}</td>
    <td>${cat.total_a + cat.total_b}</td>
    <td>${balATotal}</td>
    <td>${balBTotal}</td>
    <td>إلى ${escapeHTML(bB)}: ${cat.total_a_to_b} | إلى ${escapeHTML(bA)}: ${cat.total_b_to_a}</td>
  </tr>`;

  html += '</tbody></table>';
  tableWrap.innerHTML = html;
  wrap.appendChild(tableWrap);

  // === بطاقات للجوال ===
  const cards = document.createElement('div');
  cards.className = 'item-cards';
  cat.items.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'item-card';

    let nameTxt = escapeHTML(item.device_name);
    let nameCls = 'device-name';
    if (item.only_in === 'A') {
      nameTxt += ` ⚠ في ${escapeHTML(bA)} فقط`;
      nameCls += ' warn';
    } else if (item.only_in === 'B') {
      nameTxt += ` ⚠ في ${escapeHTML(bB)} فقط`;
      nameCls += ' warn';
    }

    let dirCls, dirTxt;
    if (item.transfer_direction === 'متوازن') {
      dirCls = 'green'; dirTxt = '✓ متوازن';
    } else if (item.transfer_direction === 'A←B') {
      dirCls = 'orange';
      dirTxt = `↘ ${escapeHTML(bA)} ← ${escapeHTML(bB)}  (${item.transfer_qty})`;
    } else {
      dirCls = 'red';
      dirTxt = `↙ ${escapeHTML(bB)} ← ${escapeHTML(bA)}  (${item.transfer_qty})`;
    }

    card.innerHTML = `
      <div class="${nameCls}">${idx + 1}. ${nameTxt}</div>
      <div class="item-grid">
        <div class="stat"><span class="lbl">${escapeHTML(bA)} قبل</span><span class="val">${item.qty_a}</span></div>
        <div class="stat"><span class="lbl">${escapeHTML(bB)} قبل</span><span class="val">${item.qty_b}</span></div>
        <div class="stat"><span class="lbl">${escapeHTML(bA)} بعد</span><span class="val" style="color:#2ecc71">${item.balanced_a}</span></div>
        <div class="stat"><span class="lbl">${escapeHTML(bB)} بعد</span><span class="val" style="color:#2ecc71">${item.balanced_b}</span></div>
        <div class="transfer ${dirCls}">${dirTxt}</div>
      </div>
    `;
    cards.appendChild(card);
  });

  // بطاقة الإجمالي
  const totalsCard = document.createElement('div');
  totalsCard.className = 'cat-totals-card';
  totalsCard.innerHTML = `
    Σ إجمالي الفئة<br>
    ${escapeHTML(bA)}: ${cat.total_a} → ${balATotal} &nbsp;|&nbsp;
    ${escapeHTML(bB)}: ${cat.total_b} → ${balBTotal}<br>
    نقل إلى ${escapeHTML(bB)}: ${cat.total_a_to_b} | نقل إلى ${escapeHTML(bA)}: ${cat.total_b_to_a}
  `;
  cards.appendChild(totalsCard);

  wrap.appendChild(cards);
  return wrap;
}

/* ═══════════════════════════════════════════════════════════════════
   قسم 10: التصدير والمشاركة
   ═══════════════════════════════════════════════════════════════════ */

async function copyMemo() {
  if (!lastResult) return;
  const memo = generateMemo(lastResult);
  try {
    await navigator.clipboard.writeText(memo);
    showToast('تم نسخ المذكّرة إلى الحافظة', 'success');
  } catch (e) {
    // طريقة بديلة قديمة
    const ta = document.createElement('textarea');
    ta.value = memo;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('تم نسخ المذكّرة', 'success');
    } catch (e2) {
      showToast('فشل النسخ - افتح "عرض المذكّرة" والصق يدوياً', 'error');
    }
    document.body.removeChild(ta);
  }
}

function showMemo() {
  if (!lastResult) return;
  $('memo-text').textContent = generateMemo(lastResult);
  $('memo-modal').classList.add('show');
}

function closeMemo() {
  $('memo-modal').classList.remove('show');
}

async function shareMemo() {
  if (!lastResult) return;
  const memo = generateMemo(lastResult);
  if (navigator.share) {
    try {
      await navigator.share({
        title: `مذكّرة موازنة - ${lastResult.session_name}`,
        text: memo,
      });
    } catch (e) {
      if (e.name !== 'AbortError') {
        showToast('تعذرت المشاركة - استخدم النسخ', 'warn');
      }
    }
  } else {
    copyMemo();
  }
}

function exportCSV() {
  if (!lastResult) return;
  const r = lastResult;
  const rows = [];
  // BOM لدعم العربية في Excel
  rows.push('\uFEFFالقسم,الفئة,الجهاز,' + r.branch_a + ' (قبل),' + r.branch_b + ' (قبل),المجموع,' + r.branch_a + ' (بعد),' + r.branch_b + ' (بعد),اتجاه النقل,الكمية المنقولة,تنبيه');

  for (const cat of r.categories) {
    let catWarn = '';
    if (cat.only_in === 'A') catWarn = `الفئة في ${r.branch_a} فقط`;
    else if (cat.only_in === 'B') catWarn = `الفئة في ${r.branch_b} فقط`;
    for (const item of cat.items) {
      let dir = item.transfer_direction === 'متوازن' ? 'متوازن' :
                item.transfer_direction === 'A←B' ? `${r.branch_a} ← ${r.branch_b}` :
                `${r.branch_b} ← ${r.branch_a}`;
      let warn = catWarn;
      if (item.only_in === 'A') warn = (warn ? warn + ' / ' : '') + `الجهاز في ${r.branch_a} فقط`;
      else if (item.only_in === 'B') warn = (warn ? warn + ' / ' : '') + `الجهاز في ${r.branch_b} فقط`;
      const fields = ['موازنة', cat.name, item.device_name, item.qty_a, item.qty_b, item.total, item.balanced_a, item.balanced_b, dir, item.transfer_qty, warn];
      rows.push(fields.map(f => `"${String(f).replace(/"/g, '""')}"`).join(','));
    }
  }

  // قسم الأجهزة الناقصة
  if (r.low_stock && r.low_stock.length > 0) {
    rows.push(''); // سطر فاصل
    const threshold = r.low_threshold;
    rows.push(`"أجهزة < ${threshold} في أحد الفرعين"`);
    for (const ls of r.low_stock) {
      let warn = ls.low_in === 'BOTH' ? `نقص في كلا الفرعين` :
                 ls.low_in === 'A' ? `نقص في ${r.branch_a}` :
                 `نقص في ${r.branch_b}`;
      const fields = ['ناقص', ls.category_name, ls.device_name, ls.qty_a, ls.qty_b, '', '', '', '', '', warn];
      rows.push(fields.map(f => `"${String(f).replace(/"/g, '""')}"`).join(','));
    }
  }

  const csv = rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const safeName = (r.session_name || 'balance').replace(/[^a-zA-Z0-9_\u0600-\u06ff -]/g, '_');
  const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  const a = document.createElement('a');
  a.href = url;
  a.download = `${safeName}_${today}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 200);
  showToast('تم تنزيل ملف CSV', 'success');
}

/* ═══════════════════════════════════════════════════════════════════
   قسم 11: PWA - Service Worker + Install Prompt
   ═══════════════════════════════════════════════════════════════════ */

// Service Worker مدمج كـ Blob URL (يجعل التطبيق يعمل من ملف واحد)
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'dual-balance-v1';
    self.addEventListener('install', (e) => {
      self.skipWaiting();
    });
    self.addEventListener('activate', (e) => {
      e.waitUntil(self.clients.claim());
    });
    self.addEventListener('fetch', (e) => {
      // استراتيجية: cache-first للجذر، ثم شبكة
      if (e.request.method !== 'GET') return;
      e.respondWith(
        caches.open(CACHE).then(cache =>
          cache.match(e.request).then(cached => {
            const fetchPromise = fetch(e.request).then(resp => {
              if (resp && resp.status === 200 && resp.type === 'basic') {
                cache.put(e.request, resp.clone());
              }
              return resp;
            }).catch(() => cached);
            return cached || fetchPromise;
          })
        )
      );
    });
  `;

  // محاولة تسجيل SW من ملف منفصل أو blob
  window.addEventListener('load', () => {
    // نحاول أولاً تسجيل sw.js إذا كان متاحاً (للنشر على الويب)
    navigator.serviceWorker.register('sw.js').catch(() => {
      // إذا فشل (مثل فتح الملف مباشرة)، نستخدم blob - لكن blob SW
      // ممنوع في معظم المتصفحات لأسباب أمنية. لذا نتجاهل بهدوء.
      console.log('Service Worker لم يُسجَّل (طبيعي عند فتح الملف مباشرة)');
    });
  });
}

// Install Prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $('install-btn').style.display = 'inline-block';
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      $('install-btn').style.display = 'none';
    });
  } else {
    showToast('استخدم خيار "تثبيت" أو "إضافة إلى الشاشة الرئيسية" من قائمة المتصفح', 'warn');
  }
}

window.addEventListener('appinstalled', () => {
  $('install-btn').style.display = 'none';
  showToast('تم تثبيت التطبيق بنجاح!', 'success');
});
